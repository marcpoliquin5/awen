[package]
name = "awen_compiler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hardware-aware tensor-to-photonic compiler for AWEN"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
