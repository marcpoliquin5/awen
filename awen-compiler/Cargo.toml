[package]
name = "awen_compiler"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Hardware-aware tensor-to-photonic compiler for AWEN"
repository = "https://github.com/marcpoliquin5/awen"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.11"
