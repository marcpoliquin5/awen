[project]
name = "awen-studio"
version = "0.1.0"
description = "AWEN Studio: a local web app over the AWEN compiler, photonic simulator, AWEN-Mini and the Lab Agent. Runs on localhost only; not a hosted service."
readme = "README.md"
license = "MIT"
authors = [{ name = "AWEN contributors" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
awen-studio = "awen_studio.cli:main"

[project.urls]
Repository = "https://github.com/marcpoliquin5/awen"

[tool.setuptools]
packages = ["awen_studio"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
