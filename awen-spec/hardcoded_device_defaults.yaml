# Device energies, noise, calibration and precision literals still hard-coded in Rust (Master Prompt v2, section 9).
#
# The rule is that every simulator and cost estimate reads these from hardware_assumptions.yaml.
# Until the compiler does, this file lists every such literal in the non-test Rust source under
# `scope`, so none is added silently. scripts/hardcoded_defaults.py --check (run in CI via
# scripts/tests) fails when
#   - a scoped file gains a device literal that is not listed here (including in a new function),
#   - a listed literal changed or no longer exists in the code, or
#   - a status disagrees with hardware_assumptions.yaml:
#       unsourced               - the named assumption has no value yet, or no assumption entry exists
#       matches_assumption      - the code value equals a value stored for that assumption
#       differs_from_assumption - the assumption has values and the code value is none of them
#       definitional            - fixed by construction (ideal contract, identity calibration,
#                                 zero-initialized accumulator); not a device assumption
# A block is one function (`impl <header>::<fn>` for methods); a field repeated in one block is
# numbered `#2`, `#3`... in source order. Only single-line literals are seen: a number inside a
# longer expression (for example a `map_or(20.0, ...)` fallback) is not, and `not_yet_inventoried`
# names the code outside `scope`. Statuses describe the code as it is; no default is changed here.
version: awen.hardcoded-device-defaults.v0
assumption_set: awen.hardware-assumptions.v0
scope: [awen-compiler/src]
not_yet_inventoried:
  - "awen-runtime/src (for example hal_v0.rs device descriptors and executable.rs noise\
  \ contracts)"
  - "awen-native/src"
  - "awen-mlir"
  - "Python packages (awen-models, awen-physics, awen-systems, awen-qphotonic, awen-lab,\
  \ awen-studio, awen-ecosystem)"
