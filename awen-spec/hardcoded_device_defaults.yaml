  - {block: pace_like_128_descriptor, field: detector_bandwidth_ghz, value: 20.0, unit: GHz, assumption: photodetector.bandwidth, status: unsourced, notes: photodetector.bandwidth has no checked value yet}
  - {block: pace_like_128_descriptor, field: insertion_loss_budget_db, value: 12.0, unit: dB, assumption: null, status: unsourced, notes: no system loss-budget entry in the assumption set yet}
  - {block: pace_like_128_descriptor, field: laser_power_mw, value: 500.0, unit: mW, assumption: null, status: unsourced, notes: 'total laser power; laser.channel_optical_power is per channel (up to 30 mW in hua2025), so not comparable'}
  - {block: pace_like_128_descriptor, field: total_power_budget_mw, value: 2000.0, unit: mW, assumption: null, status: unsourced, notes: no system power-budget entry in the assumption set yet}
  - {block: pace_like_128_descriptor, field: dac_energy_pj_per_sample, value: 2.0, unit: pJ, assumption: dac.energy_per_conversion, status: unsourced, notes: dac.energy_per_conversion has no checked value yet}
  - {block: pace_like_128_descriptor, field: adc_energy_pj_per_sample, value: 4.0, unit: pJ, assumption: adc.published_designs, status: differs_from_assumption, notes: 'below both published designs (6.35 pJ at 10.0 ENOB, 0.5 GS/s, 16 nm; 31.7 pJ at 9.4 ENOB, 5 GS/s, 28 nm) while the descriptor declares 10-bit ADCs at 20 GS/s; do not interpolate between the points'}
  - {block: digital_baseline_default, field: energy_pj_per_mac, value: 20.0, unit: pJ, assumption: null, status: unsourced, notes: digital (CPU) baseline; the v0 assumption set has no digital-baseline section}
  - {block: digital_baseline_default, field: effective_bits, value: 16, unit: bits, assumption: null, status: unsourced, notes: digital baseline precision; no digital-baseline section in the assumption set}
  - {block: cost_inputs_from_capabilities, field: memory_energy_pj_per_byte, value: 0.5, unit: pJ/byte, assumption: null, status: unsourced, notes: no memory-energy entry in the assumption set yet}
