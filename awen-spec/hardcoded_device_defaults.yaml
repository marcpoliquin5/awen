  - {block: cost_inputs_from_capabilities, field: modulator_energy_pj_per_sample, value: 1.0, unit: pJ, assumption: modulator.energy_per_symbol, status: unsourced, notes: modulator.energy_per_symbol has no checked value yet (unit fJ there)}
  - {block: cost_inputs_from_capabilities, field: detector_energy_pj_per_sample, value: 1.0, unit: pJ, assumption: null, status: unsourced, notes: no detector-energy entry in the assumption set yet}
  - {block: cost_inputs_from_capabilities, field: digital_accumulation_energy_pj_per_mac, value: 0.25, unit: pJ, assumption: null, status: unsourced, notes: no digital-accumulation entry in the assumption set yet}
  - {block: cost_inputs_from_capabilities, field: calibration_amortization_energy_uj, value: 0.001, unit: uJ, assumption: null, status: unsourced, notes: no calibration-energy entry in the assumption set yet}
  - {block: decide_placement_with_tuning, field: energy_pj_per_mac, value: 10.0, unit: pJ, assumption: null, status: unsourced, notes: digital (GPU) baseline used by decide_placement_with_tuning; no digital-baseline section}
  - {block: decide_placement_with_tuning, field: effective_bits, value: 16, unit: bits, assumption: null, status: unsourced, notes: digital baseline precision; no digital-baseline section}
  - {block: compile_options_default, field: cpu_energy_pj_per_mac, value: 20.0, unit: pJ, assumption: null, status: unsourced, notes: digital (CPU) baseline; no digital-baseline section}
