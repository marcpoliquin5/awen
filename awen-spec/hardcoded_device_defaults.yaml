# Device energies, noise, calibration and precision literals still hard-coded in Rust (Master Prompt v2, section 9).
#
# The rule is that every simulator and cost estimate reads these from hardware_assumptions.yaml.
# Until the compiler does, this file lists every such literal in the non-test Rust source under
# `scope`, so none is added silently. scripts/hardcoded_defaults.py --check (run in CI via
# scripts/tests) fails when
#   - a scoped file gains a device literal that is not listed here (including in a new function),
#   - a listed literal changed or no longer exists in the code, or
#   - a status disagrees with hardware_assumptions.yaml:
#       unsourced               - the named assumption has no value yet, or no assumption entry exists
#       matches_assumption      - the code value equals a value stored for that assumption
#       differs_from_assumption - the assumption has values and the code value is none of them
#       definitional            - fixed by construction (ideal contract, identity calibration,
#                                 zero-initialized accumulator, a disabled term contributing 0)
#       numeric_guard           - a floor, cap or clamp that keeps arithmetic defined (divide-by-zero
#                                 guards, fractions capped at 1, non-negative clamps); not a device value
# A block is one function (`impl <header>::<fn>` for methods); a field repeated in one block is
# numbered `#2`, `#3`... in source order. Two forms are seen: single-line `field: <number>,`
# literals, and float literals passed to `.map_or`, `.unwrap_or`, `.max`, `.min` or `.clamp`
# inside an expression (listed as field `expr:<method>`; for `clamp` the lower bound). Not seen:
# integer arguments (count guards such as `.max(1)`), `fold` initial values, arithmetic factors
# such as `latency * 0.01`, and fields whose names do not match the device-field pattern in the
# script (for example `optical_propagation_ns: 0.1`, `t1_ns`, `photon_count`, `click_probability`, `coupling_q`),
# lines with a trailing comment (for example `read_latency_ns: 1000, // ...` in state/memory.rs) and
# tuple values (for example `nominal_voltage_range: (0.0, 10.0)` in hal_v0.rs).
# C++ in awen-mlir (lib, include, tools; the lit tests under awen-mlir/test are fixtures, not scanned) has one form:
# named defaults `constexpr <type> kDefault<Name> = <number>;` at file scope, listed under the constant name. Not seen
# in C++: validation bounds in comparisons (for example `carrierWavelengthNm <= 0.0`, `confidenceLevel > 1.0`) and
# constants not named kDefault* (for example `kDialectMajor = 1`). awen-native/src is Rust and is scanned with the
# Rust forms; it has no literal in either form (its one numeric default is the PyO3 signature `signal = 1.0`, a
# normalized input amplitude passed to predicted_sigmas, not a device value, and not a scanned form).
# Python in awen-models (the `awen` and `awen_models` packages; tests and examples are not scanned) has three forms,
# read with the ast module: module constants, class-body fields (dataclass defaults, context `class <Name>`) and
# parameter defaults (context `<fn>` or `<Class>.<fn>`), with literal numbers only. Python names match the Rust
# field pattern plus `wavelength` and `tile_*`; a bare `temperature` is the sampling/distillation softmax temperature
# there and is not matched. Not seen in Python: nested functions, numbers inside expressions or calls, and physical
# constants such as `PLANCK` and `LIGHT_SPEED` in photon_training.py (exact SI values, not device values).
# awen-physics (`awen_physics`) and awen-systems (`awen_systems`) are scanned with the same Python forms (their tests sit
# outside the package and are not scanned). awen_physics has no device default in a scanned form: device values are
# required arguments, and its numeric defaults are solver settings (tolerances, step counts, `courant`, `points_per_um`)
# or a source pulse centre (`centre_um = 1.0` in fdtd1d.reflectance_spectrum), which the field pattern does not match.
# Not seen in awen_systems: the memory technology table in memory.py (numbers inside `P(value, unit, source type,
# citation, ...)` calls, each already carrying its own source label), the illustrative fabric.study() parameters in a
# dict literal (400e9 bit/s, 25e-9 s, 500e-9 s, labelled "assumed parameter (illustrative; not literature, not
# measured)" in the code), `C_LIGHT` (exact SI value), and zero defaults whose names the field pattern does not match
# (`Link.loss_db`, `FabricConfig.loss_db`, `FabricConfig.reconfig_delay_s`; each 0.0 disables its term) and Link
# accumulators (`busy_until`, `bits`, `busy_s`).
# awen-qphotonic (`awen_qphotonic`) is scanned with the same Python forms (its tests sit outside the package and are
# not scanned). Found: two zero dark-count defaults (ideal detector) and the `noise` default of kernel.run_experiment,
# which is the standard deviation of Gaussian jitter added to the synthetic moons/circles input features (a dataset
# parameter matched by the `noise` field name, not a device value). Not seen in awen_qphotonic: ExperimentSpec
# `source_efficiency`, `circuit_transmission` and `detector_efficiency` (each 1.0, lossless), `trigger_rate_hz = 1e6`
# and `target_samples = 1000`, whose names the field pattern does not match, and `shots = 1000` in run_experiment.
# awen-lab (`awen_lab`) is scanned with the same Python forms (its tests sit outside the package and are not scanned).
# Found: three photon-count fields of policy.OperatingBounds, the request limits the Lab Agent checks before it runs a
# simulation (photons_per_mac in [1, 1e9] for photonic_gemm, at most 4 input photons for boson_sampling); they bound
# accepted requests and are not device values. Not seen in awen_lab: the other OperatingBounds limits, whose names the
# field pattern does not match (`max_matrix_elements`, `max_inner_dim`, `max_seeds`, `max_modes`, `max_shots`), the
# `exp.get("tile_k", 64)` fallback in sims.run_photonic_gemm (a number inside a call, the same 64 as the awen-models
# tile_k entries), the bootstrap parameter defaults in agent.py (`seed = 0`, `resamples = 2000`; names not matched)
# and the `3.0` factor of the boson-sampling tv_bound (a number inside an expression).
# awen-studio (`awen_studio`) is scanned with the same Python forms, and class-body fields also count when the default
# is the first argument of a pydantic `Field(<number>, ...)` (or `Field(default=...)`, dataclass `field(default=...)`)
# call; that form is new with awen-studio and finds nothing in the packages scanned before. Found: the `tile_k` request
# default of CompareRequest (the photonic GEMM tile passed to awen_native.photonic_gemm). Not seen in awen_studio: the
# other request defaults, whose names the field pattern does not match (`m`, `k`, `n`, `max_new_tokens`, `top_k`,
# `seed`, `input_seed`, `MAX_GEMM_DIM = 512`, `MAX_NEW_TOKENS = 400`), the sampling `temperature` 0.8 (softmax
# temperature, not matched in Python), `signal` 1.0 (normalized input amplitude, as in awen-native), the histogram
# `bins=24` and the CLI `--port` 8765 (numbers inside calls). The frontend (TypeScript) is not scanned.
# awen-ecosystem (`awen-ecosystem/python_awen/awen_py`) is scanned with the same Python forms; the tile pattern now
# also matches a prefixed name (`photonic_tile_k`), which finds nothing in the packages scanned before. Found: the
# `tile_k` parameter of device.configure and the `photonic_tile_k` fields of ExecutionOptions and TorchBackendOptions
# (all 64). Device values in the capability descriptors are read from the descriptor, not defaulted. Not seen: the
# `"tile_k": 64` value of the device.py `_STATE` dict (a dict value), the tolerances `max_abs_error` and
# `max_rel_error` 1e-5 and the finite-difference `epsilon` 1e-4 (names not matched; accuracy settings, not device
# values) and the positional `0.0` offset passed to _validate_transfer for channel calibration (a number inside a
# call). The examples (`python_awen/examples`) are scripts and are listed under not_yet_inventoried.
# `not_yet_inventoried` names the code outside `scope`. Statuses describe the code as it is; no default is changed here.
version: awen.hardcoded-device-defaults.v0
assumption_set: awen.hardware-assumptions.v0
scope: [awen-compiler/src, awen-runtime/src, awen-native/src, awen-mlir/include, awen-mlir/lib, awen-mlir/tools,
  awen-models/awen, awen-models/awen_models, awen-physics/awen_physics, awen-systems/awen_systems,
  awen-qphotonic/awen_qphotonic, awen-lab/awen_lab, awen-studio/awen_studio, awen-ecosystem/python_awen/awen_py]
not_yet_inventoried:
  - "awen-models/examples (scripts)"
  - "awen-ecosystem/python_awen/examples (scripts)"
