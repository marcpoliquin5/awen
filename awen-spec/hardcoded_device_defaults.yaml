# Device energies, noise and precision still hard-coded in Rust defaults (Master Prompt v2, section 9).
#
# The rule is that every simulator and cost estimate reads these from hardware_assumptions.yaml.
# Until the compiler does, this file lists every literal that is still hard-coded, so none is
# added silently. scripts/hardcoded_defaults.py --check (run in CI via scripts/tests) fails when
#   - a scanned block gains a device literal that is not listed here,
#   - a listed literal changed or no longer exists in the code, or
#   - a status disagrees with hardware_assumptions.yaml:
#       unsourced               - the named assumption has no value yet, or no assumption entry exists
#       matches_assumption      - the code value equals a value stored for that assumption
#       differs_from_assumption - the assumption has values and the code value is none of them
# Statuses describe the code as it is; no default is changed by this file.
version: awen.hardcoded-device-defaults.v0
assumption_set: awen.hardware-assumptions.v0
blocks:
  - {id: noise_contract_default, file: awen-compiler/src/noise.rs, anchor: impl Default for PhotonicNoiseContract}
  - {id: pace_like_128_descriptor, file: awen-compiler/src/capability.rs, anchor: 'let mut capabilities = Self {'}
  - {id: digital_baseline_default, file: awen-compiler/src/cost.rs, anchor: impl Default for DigitalBaseline}
  - {id: cost_inputs_from_capabilities, file: awen-compiler/src/cost.rs, anchor: 'pub fn from_capabilities(capabilities: &DeviceCapabilities'}
  - {id: decide_placement_with_tuning, file: awen-compiler/src/cost.rs, anchor: pub fn decide_placement_with_tuning(}
  - {id: compile_options_default, file: awen-compiler/src/compiler.rs, anchor: impl Default for CompileOptions}
  - {id: awenblas_cpu_reference, file: awen-compiler/src/awenblas/kernels.rs, anchor: pub fn cpu_reference() -> Self}
entries:
  - {block: noise_contract_default, field: photons_per_mac, value: 1000.0, unit: photons, assumption: null, status: unsourced, notes: 'illustrative operating point; the assumption set stores shot-noise energy per detection by bit depth (shot_noise.shot_noise_energy_per_detection_J), not photons per MAC'}
  - {block: noise_contract_default, field: quantum_efficiency, value: 0.8, unit: fraction, assumption: null, status: unsourced, notes: no assumption entry in this unit; photodetector.responsivity is in A/W and needs a wavelength to convert}
  - {block: noise_contract_default, field: insertion_loss_db, value: 6.0, unit: dB, assumption: mzi.insertion_loss, status: unsourced, notes: total optical path loss in the noise contract; the assumption entry is per MZI and has no value yet}
  - {block: noise_contract_default, field: phase_sigma_rad, value: 0.002, unit: rad, assumption: null, status: unsourced, notes: no phase-error entry in the assumption set yet}
  - {block: noise_contract_default, field: drift_rad_per_sqrt_s, value: 0.0, unit: rad/sqrt(s), assumption: null, status: unsourced, notes: drift disabled by default; no drift entry in the assumption set yet}
  - {block: noise_contract_default, field: rin_db_per_hz, value: -150.0, unit: dB/Hz, assumption: laser.rin, status: unsourced, notes: illustrative; laser.rin has no checked value yet}
  - {block: noise_contract_default, field: detection_bandwidth_hz, value: 10000000000.0, unit: Hz, assumption: photodetector.bandwidth, status: unsourced, notes: photodetector.bandwidth has no checked value yet (unit GHz there)}
  - {block: noise_contract_default, field: thermal_noise_electrons, value: 100.0, unit: electrons rms, assumption: null, status: unsourced, notes: no detector thermal-noise entry in the assumption set yet}
  - {block: noise_contract_default, field: crosstalk_db, value: -35.0, unit: dB, assumption: mzi.crosstalk, status: unsourced, notes: mzi.crosstalk has no checked value yet}
  - {block: noise_contract_default, field: dac_bits, value: 8, unit: bits, assumption: dac.weight_dac_bits, status: matches_assumption, notes: equals the 8-bit weight DAC of the PACE system (hua2025)}
  - {block: noise_contract_default, field: adc_bits, value: 8, unit: bits, assumption: null, status: unsourced, notes: 'no ADC bit-depth entry; system.pace_enob (7.61) is a whole-system ENOB, not an ADC resolution'}
  - {block: pace_like_128_descriptor, field: adc_bits, value: 10, unit: bits, assumption: null, status: unsourced, notes: reference descriptor 'reference-pace-like-128'; no ADC bit-depth entry in the assumption set}
  - {block: pace_like_128_descriptor, field: dac_bits, value: 10, unit: bits, assumption: dac.weight_dac_bits, status: differs_from_assumption, notes: 'descriptor is named PACE-like, but the PACE weight DAC is 8-bit (hua2025)'}
  - {block: pace_like_128_descriptor, field: effective_bits, value: 8, unit: bits, assumption: system.pace_enob, status: differs_from_assumption, notes: PACE system average channel ENOB is 7.61 bits (hua2025)}
  - {block: pace_like_128_descriptor, field: shot_noise_fraction, value: 5.0e-05, unit: fraction, assumption: null, status: unsourced, notes: relative noise; no entry in this form in the assumption set}
  - {block: pace_like_128_descriptor, field: thermal_noise_fraction, value: 2.0e-05, unit: fraction, assumption: null, status: unsourced, notes: relative noise; no entry in this form in the assumption set}
