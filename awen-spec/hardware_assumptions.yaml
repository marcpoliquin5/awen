# AWEN hardware assumptions, set v0 (Master Prompt v2, section 9).
#
# Every simulator, cost estimate and benchmark is meant to read device energies and noise
# from this file; no other file may hard-code them. Wiring the noise model and cost
# estimates to this file is a separate change (see STATUS.md).
#
# Each parameter has low / typical / high values, or one of: `kind: sweep` (values keyed by a swept
# variable such as bit depth), `kind: by_device_length_mm` (values keyed by device length),
# `kind: points` (separate published designs, not a curve); plus a unit, and a source with a type:
#   measured  - peer-reviewed measurement (citation)
#   vendor    - manufacturer claim, not independently verified
#   estimate  - derived by AWEN with the stated formula
# Per-parameter keys: `source_type: estimate` marks a value AWEN derived (formula in `notes`);
# `type` on modulator entries is the device type (tfln_mzm, silicon_unspecified, unspecified).
# Every parameter has `notes` ("no checked source yet" when the value is null and unsourced).
# A value of null means no checked source yet. A null is never filled with a guess.
# Sources were checked on 2026-10-18 against the publisher page or the Crossref record.
version: awen.hardware-assumptions.v0
date: "2026-10-18"

sources:
  hua2025:
    citation: "S. Hua et al., An integrated large-scale photonic accelerator with ultralow latency, Nature 640, 361-367 (2025)"
    doi: 10.1038/s41586-025-08786-6
    type: measured
    note: "Lightelligence PACE, 64x64 incoherent MAC, 65-nm silicon photonics + 28-nm CMOS EIC"
  wang2018:
    citation: "C. Wang et al., Integrated lithium niobate electro-optic modulators operating at CMOS-compatible voltages, Nature 562, 101-104 (2018)"
    doi: 10.1038/s41586-018-0551-y
    type: measured
  xu2024:
    citation: "Z. Xu et al., Large-scale photonic chiplet Taichi empowers 160-TOPS/W artificial general intelligence, Science 384, 202-209 (2024)"
    doi: 10.1126/science.adl1203
    type: measured
    note: "on-chip efficiency figure; Master Prompt v2 notes it excludes much of the system electronics"
  ramkaj2020:
    citation: "A. T. Ramkaj et al., A 5-GS/s 158.6-mW 9.4-ENOB passive-sampling time-interleaved three-stage pipelined-SAR ADC with analog-digital corrections in 28-nm CMOS, IEEE JSSC (2020)"
    doi: 10.1109/jssc.2019.2960476
    type: measured
  lagos2021:
    citation: "J. Lagos et al., A 10.0 ENOB, 6.2 fJ/conv.-step, 500 MS/s ringamp-based pipelined-SAR ADC with background calibration and dynamic reference regulation in 16nm CMOS, Symposium on VLSI Circuits (2021)"
    doi: 10.23919/vlsicircuits52068.2021.9492354
    type: measured
  sedighi2012:
    citation: "B. Sedighi, M. Khafaji, J. C. Scheytt, Low-power 8-bit 5-GS/s digital-to-analog converter for multi-gigabit wireless transceivers, International Journal of Microwave and Wireless Technologies 4(3), 275-282 (2012)"
    doi: 10.1017/s175907871200013x
    type: measured
    note: "checked 2026-11-03 on Crossref; 26 mW at 5 GS/s read from the published abstract (prototype chip, 0.13 um SiGe BiCMOS)"
  palmers2010:
    citation: "P. Palmers, M. S. J. Steyaert, A 10-bit 1.6-GS/s 27-mW current-steering D/A converter with 550-MHz 54-dB SFDR bandwidth in 130-nm CMOS, IEEE TCAS-I 57(11), 2870-2879 (2010)"
    doi: 10.1109/tcsi.2010.2052491
    type: measured
    note: "checked 2026-11-03 on Crossref; 27 mW at 1.6 GS/s (near-Nyquist output) read from the title and abstract"
  kim2016:
    citation: "S.-N. Kim et al., A SUC-based full-binary 6-bit 3.1-GS/s 17.7-mW current-steering DAC in 0.038 mm2, IEEE TVLSI 24(2), 794-798 (2016)"
    doi: 10.1109/tvlsi.2015.2412657
    type: measured
    note: "checked 2026-11-03 on Crossref; 17.7 mW at 3.1 GS/s read from the title and abstract (prototype, 90-nm CMOS)"
  timurdogan2014:
    citation: "E. Timurdogan et al., An ultralow power athermal silicon modulator, Nature Communications 5, 4008 (2014)"
    doi: 10.1038/ncomms5008
    type: measured
    note: "checked 2026-11-04 on Crossref and the open-access article; 3.65 fJ switching energy and 0.91 fJ per bit measured by time-domain reflectometry (Methods), 25 Gb/s NRZ-OOK, 0.5 Vpp, 4.8-um silicon microdisk"
  oconnor2017:
    citation: "M. O'Connor, N. Chatterjee, D. Lee, J. Wilson, A. Agrawal, S. W. Keckler, W. J. Dally, Fine-Grained DRAM: Energy-Efficient DRAM for Extreme Bandwidth Systems, Proc. MICRO-50 (2017)"
    doi: 10.1145/3123939.3124545
    type: measured
    note: "checked 2026-11-05 on the NVIDIA open PDF (doi 10.1145/3123939.3124545); Section 1 quote verified: 'The energy to access a bit in HBM2 is approximately 3.97 pJ/bit' (Fig. 1b breakdown: on-die data movement, activation, I/O). Already cited in awen-systems memory baseline."

  harris2014:
    citation: "N. C. Harris et al., Efficient, compact and low loss thermo-optic phase shifter in silicon, Optics Express 22, 10487-10493 (2014); arXiv:1410.3616 (OSA electronic reprint)"
    doi: 10.1364/OE.22.010487
    type: measured
    note: "checked 2026-11-06 on Crossref and the arXiv:1410.3616 PDF (Optics Express electronic reprint). Measured Pπ 24.77 ± 0.43 mW (abstract, Table I, body text from MZI phase-vs-power). Measured -3 dB bandwidth 130.0 ± 5.59 kHz (abstract, body text, lock-in). Measured phase-shifter insertion loss 0.23 ± 0.13 dB over 21 devices across an 8-inch wafer (abstract, Section 4 body text, Fig. 3(d)); re-read 2026-11-10 in the arXiv:1410.3616 PDF and Crossref re-checked (vol 22, issue 9, page 10487). Table I τ 2.69 µs via the paper's single-pole τ = 0.35/f_3dB; Table I Pπ·τ product 66.9 mW·µs."
  diamantopoulos2021:
    citation: "N.-P. Diamantopoulos et al., 47.5 GHz Membrane-III-V-on-Si Directly Modulated Laser for Sub-pJ/bit 100-Gbps Transmission, Photonics 8, 31 (2021)"
    doi: 10.3390/photonics8020031
    type: measured
    note: "checked 2026-11-06 on Crossref and the MDPI open-access PDF. At 25 °C / 9.1 mA: DC power 19.565 mW, wall-plug efficiency 6.44% (wide-apparatus photodetection without fiber), net 113.42 Gbps under KP4-FEC; paper estimates DC energy/bit 0.17 pJ/bit (= P_DC / net rate). At 50 °C: DC 38.656 mW, 0.34 pJ/bit. RF driver energy excluded."
  zortman2012:
    citation: "W. A. Zortman, A. L. Lentine, D. C. Trotter, M. R. Watts, Integrated CMOS Compatible Low Power 10Gbps Silicon Photonic Heater-Modulator, Optical Fiber Communication Conference (OFC/NFOEC) 2012, paper OW4I.5"
    doi: 10.1364/ofc.2012.ow4i.5
    type: measured
    note: "checked 2026-11-06 on Crossref and the Sandia open PDF. Measured heater efficiency 7 µW/GHz (stable across ~5–6 nm tuning; <1 V). Paper estimates 180 fJ/bit for realistic operation at 10 Gbps assuming 80 GHz manufacturing variation and 40 °C environmental swing (~10 GHz/°C), noting Gaussian half-mean; Fig. 3 mid column 535 mV × 3.4 mA ≈ 1.82 mW ≈ 182 fJ/bit at 10 Gbps. Heater only (no closed-loop control ASIC); modulator switching energy separate."
  sun2016:
    citation: "C. Sun, M. Wade, M. Georgas, S. Lin, L. Alloatti, B. Moss, R. Kumar, A. H. Atabaki, F. Pavanello, J. M. Shainline, J. S. Orcutt, R. J. Ram, M. Popović, V. Stojanović, A 45 nm CMOS-SOI Monolithic Photonics Platform With Bit-Statistics-Based Resonant Microring Thermal Tuning, IEEE J. Solid-State Circuits 51(4), 893-907 (2016)"
    doi: 10.1109/JSSC.2016.2519390
    type: measured
    note: "checked 2026-11-07 on Crossref (vol 51, issue 4, pp 893-907) and the published abstract (full text closed). Abstract: the closed-loop bit-statistical microring tuner consumes 0.74 mW in the logic, 524 GHz tuning range at 3.8 µW/GHz heater efficiency, integrated with a 5 Gb/s 30 fJ/bit monolithic microring transmitter. Cross-check (not a value used here): the first author's open MIT PhD thesis (C. Sun, Silicon-Photonics for VLSI Systems, MIT 2015, hdl:1721.1/99784), Fig. 6-16, gives the same tuner's per-bit breakdown in the 5 Gb/s link: backend 152 fJ/bit, frontend (integrator, SAR ADC) 39 fJ/bit, heater 290 fJ/bit separate; 152 fJ/bit × 5 Gb/s ≈ 0.76 mW (our arithmetic), close to the 0.74 mW logic figure. The VLSI 2015 conference abstract (doi:10.1109/VLSIC.2015.7231348) states 275 fJ/bit for the thermal tuner without a breakdown; not used."

  li2018:
    citation: "S. Li, F. Spagna, J. Chen, X. Wang, L. Tong, et al., A Power and Area Efficient 2.5-16 Gbps Gen4 PCIe PHY in 10nm FinFET CMOS, 2018 IEEE Asian Solid-State Circuits Conference (A-SSCC), pp. 5-8"
    doi: 10.1109/ASSCC.2018.8579314
    type: measured
    note: "checked 2026-11-07 on Crossref (doi 10.1109/asscc.2018.8579314; published Nov 2018, pages 5-8) and the published abstract via Semantic Scholar (full text closed; OpenAlex reports no open copy). Abstract: a 2.5-16 Gbps Gen4 PCIe transceiver with 3-tap Tx EQ and 8-tap Rx DFE in 10 nm FinFET CMOS; power efficiency 7.5 pJ/b; footprint 129.6×945.0 µm² per link. Intel authors (Shenggao Li et al.). This is a full PHY transceiver (TX+RX), not TX-only."

  elmas2025:
    citation: "G. Elmas, I. A. Litvin, P. Kohl, J. Nötzel, Modeling and analysis of phase instability in a photonic processor, Applied Optics 64(14), 3995 (2025)"
    doi: 10.1364/AO.560370
    type: measured
    note: "checked 2026-11-09 on Crossref (Applied Optics vol 64, issue 14, page 3995, published 2025-05-06; authors Elmas, Litvin, Kohl, Nötzel) and the accepted manuscript arXiv:2606.25196v1 (HTML, read in full). 8-mode silicon MZI-mesh processor; relative phase between two input signals extracted from four output powers (Eq. 7), about 125 readings/s per channel. Sec. 2, Eq. 2: Brownian model var(phi(dt)) = sigma^2 dt. Sec. 4 and Fig. 3 caption: 35 experiments of 300 s each; simulations with sigma = 0.25 [sec]^-1/2 reproduce the measured phase distribution (discrepancy about 9%; Fig. 4 spectra about 12%). Sec. 6 and Fig. 6 caption: a separate feedback-control run (38 Hz correction, feedback off for the first 60 s) is matched with sigma = 0.15 [sec]^-1/2. The instability is attributed to air-cooling-fan airflow vibrating the input optical fibers (input path, not on-chip weights); no active temperature control of the fiber is described. Both sigma values are the authors' Brownian-model parameters matched to their measurements, not a directly reported measured statistic."

parameters:
  laser:
    channel_optical_power:
      {low: null, typical: null, high: 30.0, unit: mW, source: hua2025,
       notes: "per laser channel, 'sub-mW to about 30 mW' in the PACE system"}
    wall_plug_efficiency: {low: null, typical: 0.0644, high: null, unit: fraction, source: diamantopoulos2021,
      notes: "measured 6.44% at 25 °C / 9.1 mA (wide-apparatus photodetection without fiber) at the same bias used for the 0.17 pJ/bit DC energy point; membrane III-V-on-Si DML"}
    rin: {low: null, typical: null, high: null, unit: dB/Hz, source: null,
          notes: "the noise contract default (-150 dB/Hz) is an illustrative operating point, not sourced"}
    linewidth: {low: null, typical: null, high: null, unit: Hz, source: null, notes: "no checked source yet"}
    # Two published DML DC energy-per-bit points (laser bias only), NOT a CW-mesh laser and NOT interpolated.
    published_designs:
      kind: points
      type: membrane_iii_v_on_si_dml
      unit: pJ/bit
      source: [diamantopoulos2021]
      source_type: estimate
      points:
        - {source: diamantopoulos2021, basis: dc_energy_per_bit_25C, temperature_C: 25,
           bias_mA: 9.1, dc_power_mW: 19.565, net_rate_Gbps: 113.42, energy_per_bit_pJ: 0.17,
           derivation: "paper: DC energy-efficiency 0.17 pJ/bit at 25 °C from measured DC power 19.565 mW / net 113.42 Gbps (60 GBaud PAM-4 under KP4-FEC); RF driver excluded"}
        - {source: diamantopoulos2021, basis: dc_energy_per_bit_50C, temperature_C: 50,
           bias_mA: 15.1, dc_power_mW: 38.656, net_rate_Gbps: 113.42, energy_per_bit_pJ: 0.34,
           derivation: "paper: DC energy-efficiency 0.34 pJ/bit at 50 °C from measured DC power 38.656 mW / net 113.42 Gbps; RF driver excluded"}
      notes: >-
        Membrane III-V-on-Si directly modulated laser DC energy per net information bit (Diamantopoulos et al. 2021).
        Laser bias only; RF driver not included. This is an interconnect-style DML point (laser and modulation are
        the same device), not a CW source power for an external-modulator photonic MAC. Do not add these joules to
        modulator.published_designs in one architecture total without choosing one transmitter model. Convert to
        per-token energy only as conversions x energy_per_bit under a registered bit-per-conversion rule.
  coupler:
    grating_coupler_loss:
      {low: null, typical: 1.0, high: null, unit: dB, source: hua2025,
       notes: "average coupling efficiency about -1 dB near 1310 nm"}
  modulator:
    # Wang 2018 values are keyed by the device's active length; never mix lengths in one figure.
    tfln_half_wave_voltage:
      kind: by_device_length_mm
      type: tfln_mzm
      unit: V
      source: wang2018
      values: {5: 4.4, 10: 2.3, 20: 1.4}
      notes: "Extended Data Fig. 1a-c: half-wave voltage of the 5-, 10- and 20-mm devices"
    tfln_electro_optic_bandwidth_3dB:
      kind: by_device_length_mm
      type: tfln_mzm
      unit: GHz
      source: wang2018
      values: {5: 100.0, 10: 80.0, 20: null}
      notes: "Fig. 4a-b: 3-dB electro-optic bandwidth of the 5- and 10-mm devices; the 20-mm value was not in the text read"
    tfln_on_chip_loss: {type: tfln_mzm, low: null, typical: null, high: 0.5, unit: dB, source: wang2018,
                        notes: "abstract: less than 0.5 dB on chip; device length not stated there"}
    tfln_extinction_ratio: {type: tfln_mzm, low: null, typical: 30.0, high: null, unit: dB, source: wang2018, notes: "20-mm device only (Fig. 1c / Extended Data Fig. 1)"}
    tfln_data_rate: {type: tfln_mzm, low: null, typical: null, high: 210.0, unit: Gbit/s, source: wang2018, notes: "100 Gbaud, 210 Gbit/s (Fig. 3; device length not in the text read); a data rate, not a bandwidth"}
    silicon_vector_modulator_rate: {type: silicon_unspecified, low: null, typical: 1.0, high: null, unit: GHz, source: hua2025, notes: "input-vector update rate of the PACE system; a modulation rate, not a 3-dB bandwidth"}
    silicon_weight_modulator_rate: {type: silicon_unspecified, low: null, typical: 0.01, high: null, unit: GHz, source: hua2025,
                                    notes: "10 MHz weight update with 8-bit design accuracy"}
    energy_per_symbol: {type: unspecified, low: null, typical: null, high: null, unit: fJ, source: null, notes: "no checked source yet"}
    published_designs:
      kind: points
      type: silicon_ring
      unit: fJ
      source: [timurdogan2014]
      source_type: measured
      points:
        - {source: timurdogan2014, basis: per_bit_nrz_ook, modulation: NRZ-OOK, data_rate_Gbps: 25.0, drive_Vpp: 0.5,
           energy_per_symbol_fJ: 0.91,
           derivation: "measured switching energy / 4 = 3.65 fJ / 4 (equiprobable NRZ transitions; only 0-to-1 draws energy)"}
        - {source: timurdogan2014, basis: per_full_swing_transition, modulation: NRZ-OOK, data_rate_Gbps: 25.0, drive_Vpp: 0.5,
           energy_per_symbol_fJ: 3.65,
           derivation: "measured switching energy of one 0-to-1 transition (TDR, Methods)"}
      notes: >-
        One measured resonant silicon microdisk modulator, modulator only (no driver, bias-lock or monitor circuitry;
        the paper's athermal tuning adds 0.24 to 2 fJ per bit and is not included). Binary on-off keying, not an analog
        multi-level symbol, so neither basis is the energy of a photonic MAC input symbol; the two bases bracket
        binary operation only. `energy_per_symbol` stays null.
  phase_shifter:
    thermo_optic_power_per_pi: {low: 24.34, typical: 24.77, high: 25.20, unit: mW, source: harris2014,
      notes: "measured Pπ (power for π rad phase shift) 24.77 ± 0.43 mW; low/high = mean ± reported uncertainty; abstract, Table I, body text (MZI phase vs dissipated power; Fig. 3(b) per caption)"}
    thermo_optic_reconfiguration_time: {low: null, typical: 2.69, high: null, unit: us, source: harris2014,
      notes: "Table I τ = 2.69 µs from the paper's single-pole approximation τ = 0.35/f_3dB applied to the measured -3 dB bandwidth 130.0 ± 5.59 kHz (abstract, lock-in body text; Fig. 3(c) per caption). Not a direct time-domain rise/fall measurement."}
    thermo_optic_insertion_loss: {low: 0.10, typical: 0.23, high: 0.36, unit: dB, source: harris2014,
      notes: "measured phase-shifter insertion loss 0.23 ± 0.13 dB over 21 devices on one 8-inch SOI wafer (abstract; Section 4 body text, spectra normalized to grating-coupler, MMI and waveguide propagation loss; Fig. 3(d) histogram per caption); low/high = mean ± the reported spread (the paper does not say whether it is one standard deviation). One 61.6-um heater section only: not an MZI insertion loss (excludes the two MMIs) and not the total laser-to-detector loss of the noise contract (`insertion_loss_db`), so `mzi.insertion_loss` stays null and the default contract is unchanged."}
    # One published thermo-optic point: continuous Pπ and a π-reconfiguration energy from the paper's Pπ·τ product.
    # Never interpolate; energy is an estimate (Pπ × τ), not a separately measured switching joule.
    published_designs:
      kind: points
      type: silicon_thermo_optic
      unit: pJ
      source: [harris2014]
      source_type: estimate
      points:
        - {source: harris2014, basis: pi_reconfiguration_P_times_tau, length_um: 61.6,
           power_per_pi_mW: 24.77, reconfiguration_time_us: 2.69, energy_per_pi_pJ: 66.9,
           derivation: "Table I Pπ·τ product 66.9 mW·µs (= 66.9 pJ); Pπ 24.77 mW measured (Fig. 3(b)/body), τ 2.69 µs = 0.35/f_3dB from measured 130.0 kHz bandwidth (Fig. 3(c)/body)"}
      notes: >-
        One measured CMOS SOI thermo-optic phase shifter (harris2014). Continuous hold power is Pπ when holding π;
        the published_designs energy is the paper's Pπ·τ figure of merit for one thermal π transient under the
        single-pole model, not a calorimetry measurement and not continuous hold energy during compute.
        Driver electronics and thermal crosstalk isolation are not included. `thermo_optic_power_per_pi` and
        `thermo_optic_reconfiguration_time` hold the same paper values for power-term readers.
  mzi:
    insertion_loss: {low: null, typical: null, high: null, unit: dB, source: null, notes: "no checked source yet"}
    splitter_imbalance: {low: null, typical: null, high: null, unit: fraction, source: null, notes: "no checked source yet"}
    crosstalk: {low: null, typical: null, high: null, unit: dB, source: null, notes: "no checked source yet"}
  microring:
    quality_factor: {low: null, typical: null, high: null, unit: dimensionless, source: null, notes: "no checked source yet"}
    thermal_tuning_power: {low: null, typical: null, high: null, unit: mW, source: null,
      notes: "no continuous mW source yet; heater efficiency and energy-per-bit are in thermal.* (zortman2012)"}
    locking_overhead: {low: null, typical: null, high: null, unit: mW, source: null, notes: "no checked source yet"}
  photodetector:
    responsivity: {low: null, typical: 1.0, high: null, unit: A/W, source: hua2025,
                   notes: "germanium detectors, around 1 A/W"}
    dark_current: {low: null, typical: null, high: null, unit: nA, source: null, notes: "no checked source yet"}
    bandwidth: {low: null, typical: null, high: null, unit: GHz, source: null, notes: "no checked source yet"}
  adc:
    # Two published designs, NOT a curve of energy per conversion vs bits: energy also depends on
    # sample rate, process node and architecture, so do not interpolate between them.
    published_designs:
      kind: points
      unit: pJ
      source: [lagos2021, ramkaj2020]
      source_type: estimate
      points:
        - {source: lagos2021, enob_bits: 10.0, sample_rate_GSps: 0.5, process_nm: 16,
           energy_per_conversion_pJ: 6.35, derivation: "Walden FOM x 2^ENOB = 6.2 fJ x 2^10.0"}
        - {source: ramkaj2020, enob_bits: 9.4, sample_rate_GSps: 5.0, process_nm: 28,
           energy_per_conversion_pJ: 31.7, derivation: "power / sample rate = 158.6 mW / 5 GS/s"}
      notes: "standalone CMOS ADCs; their ENOBs are ADC specs, not a photonic-system ENOB (see system.pace_enob)"
  dac:
    weight_dac_bits: {low: null, typical: 8, high: null, unit: bits, source: hua2025, notes: "weight DAC resolution of the PACE system"}
    energy_per_conversion: {low: null, typical: null, high: null, unit: pJ, source: null,
                            notes: "no single checked value; separate published designs are in dac.published_designs"}
    # Three published designs, NOT a curve of energy per conversion vs bits: energy also depends on
    # sample rate, process, output swing and architecture, so do not interpolate between them.
    published_designs:
      kind: points
      unit: pJ
      source: [sedighi2012, palmers2010, kim2016]
      source_type: estimate
      points:
        - {source: sedighi2012, resolution_bits: 8, sample_rate_GSps: 5.0, process: "0.13 um SiGe BiCMOS",
           power_mW: 26.0, energy_per_conversion_pJ: 5.2, derivation: "power / sample rate = 26 mW / 5 GS/s"}
        - {source: palmers2010, resolution_bits: 10, sample_rate_GSps: 1.6, process: "130 nm CMOS",
           power_mW: 27.0, energy_per_conversion_pJ: 16.875, derivation: "power / sample rate = 27 mW / 1.6 GS/s"}
        - {source: kim2016, resolution_bits: 6, sample_rate_GSps: 3.1, process: "90 nm CMOS",
           power_mW: 17.7, energy_per_conversion_pJ: 5.71, derivation: "power / sample rate = 17.7 mW / 3.1 GS/s"}
      notes: >-
        Standalone high-speed DACs (measured chips; power and rate from each paper's title or abstract).
        Nominal resolution, not effective bits; output swing and load differ from a modulator or phase-shifter
        driver, so these are per-design estimates for a DAC conversion, not a photonic driver energy.
  shot_noise:
    # A keyed sweep by bit depth, NOT an uncertainty range: each entry is the shot-noise floor
    # for one target precision.
    shot_noise_energy_per_detection_J:
      kind: sweep
      sweep_over: effective_bits
      unit: J
      source: null
      source_type: estimate
      values: {4: 3.28e-17, 6: 5.25e-16, 8: 8.39e-15}
      per_mac_formula: "E_per_MAC = E_per_detection / N for an N-input dot product (one detection per output)"
      notes: >-
        Optical energy per detected output: E = n h c / lambda at lambda = 1550 nm
        (1.282e-19 J per photon), with n = 4^b detected photons for b effective bits
        (SNR = sqrt(n), one bit per factor 2 in SNR). Per detection, not per MAC; divide by
        the dot-product length N for a per-MAC figure. Optics only; not a system energy.
  channels:
    rule: "channel counts are device capabilities, read from the device descriptor; never assumed here"
    wavelengths: null
    modes: null
    polarizations: null
    inter_channel_crosstalk: {low: null, typical: null, high: null, unit: dB, source: null, notes: "no checked source yet"}
  memory:
    access_energy_per_bit: {low: null, typical: null, high: null, unit: pJ/bit, source: null,
                            notes: "no single checked typical; separate published points are in memory.published_designs"}
    # One published HBM2 access-energy point, NOT a host-link figure and NOT interpolated to other DRAMs.
    published_designs:
      kind: points
      unit: pJ/bit
      source: [oconnor2017]
      source_type: measured
      points:
        - {source: oconnor2017, technology: HBM2, basis: access_per_bit,
           energy_per_bit_pJ: 3.97,
           derivation: "Section 1 quote: 'The energy to access a bit in HBM2 is approximately 3.97 pJ/bit' (Fig. 1b: on-die data movement + activation + I/O)"}
      notes: >-
        Off-chip stacked DRAM (HBM2) access energy as reported for the paper's HBM2 baseline. Includes on-die data
        movement (~2.24 pJ/bit), row activation (~1.21 pJ/bit) and I/O (~0.3 pJ/bit) per the paper's breakdown
        (summing near 3.75 to 3.92 before the stated approximate 3.97). Used for access (reads); write energy is not
        separately reported. Not a host-link (PCIe/CXL) figure, not GDDR, and not a claim about photonic memory.
        Approximate. Convert to energy per byte only as bytes x 8 bits/byte x this value.
  system:
    pace_enob:
      {low: null, typical: 7.61, high: null, unit: bits, source: hua2025,
       notes: "average channel ENOB of the whole PACE optical MAC system (25 MHz, no active feedback); a system figure, not an ADC spec"}
    efficiency_including_lasers:
      {low: null, typical: 2.38, high: null, unit: TOPS/W, source: hua2025,
       notes: "4.21 TOPS/W excluding lasers; about 8.19 TOPS throughput"}
    on_chip_efficiency_reported:
      {low: null, typical: 160.0, high: null, unit: TOPS/W, source: xu2024,
       notes: "on-chip figure; not comparable to system figures"}
    control_electronics_power: {low: null, typical: null, high: null, unit: W, source: null,
      notes: "no continuous Watt source for all control electronics; one per-ring tuner-logic energy-per-bit point is in control.published_designs (sun2016)"}
    host_transfer_energy: {low: null, typical: null, high: null, unit: pJ/byte, source: null,
      notes: "no single typical; one host-link PHY energy-per-bit point is in host_link.published_designs (li2018). Rejected 2026-11-05: PCIe PHY TX-only ~1.93 pJ/bit (Bae et al. Electronics 2021); SerDes ~11.4 pJ/bit (CICC 2020 Gen5, previously judged not host-link-only); system ~167.9 pJ/bit (Zhao et al. Perlmutter, host+device PCIe interfaces). Rejected 2026-11-07: Jalali ISSCC 2018 6 pJ/b multi-standard (not PCIe-labelled); Zhao NIC+PCIe 4.1±3.2 pJ/bit (NIC path, not host-accelerator); Analog Bits SemiWiki 6 pJ/bit (vendor blog, not peer-reviewed)"}
    thermal_stabilization_power: {low: null, typical: null, high: null, unit: W, source: null,
      notes: "no continuous Watt source yet; energy-per-bit points are in thermal.published_designs (zortman2012)"}
  # On-chip resonant-device thermal stabilization (heater), NOT a package TEC and NOT control-ASIC logic.
  thermal:
    heater_efficiency:
      {low: null, typical: 7.0, high: null, unit: uW/GHz, source: zortman2012,
       notes: "measured 7 µW/GHz heater efficiency for a 2 µm-radius silicon microdisk heater-modulator (stable across ~5–6 nm); CMOS-compatible heater voltage <1 V"}
    # One published heater energy-per-bit point (paper estimate from measured efficiency + stated variation budget).
    # Never interpolate; not a continuous package-TEC power.
    published_designs:
      kind: points
      type: silicon_microdisk_heater
      unit: fJ/bit
      source: [zortman2012]
      source_type: estimate
      points:
        - {source: zortman2012, basis: realistic_trim_plus_thermal_10Gbps, data_rate_Gbps: 10.0,
           heater_efficiency_uW_per_GHz: 7.0, manufacturing_GHz: 80.0, temperature_swing_C: 40.0,
           thermo_optic_shift_GHz_per_C: 10.0, heater_mV: 535.0, energy_per_bit_fJ: 180.0,
           derivation: "paper: estimate 180 fJ/bit at 10 Gbps for 80 GHz manufacturing + 40 °C (~10 GHz/°C) with Gaussian half-mean note; from measured 7 µW/GHz (Fig. 2); Fig. 3 mid point 535 mV × 3.4 mA ≈ 1.82 mW ≈ 182 fJ/bit at 10 Gbps"}
      notes: >-
        Integrated silicon microdisk heater energy per bit for resonant-device thermal/process trimming
        (Zortman et al. OFC 2012). Heater only; closed-loop control ASIC, package TEC, and modulator
        switching energy are not included. The 180 fJ/bit figure is the paper's estimate for a stated
        manufacturing-plus-thermal budget at 10 Gbps, not a calorimetry measurement of continuous hold.
        Do not add these joules to modulator.published_designs athermal EO compensation (timurdogan2014)
        in one architecture total without choosing one stabilization model. Convert to per-token energy
        only as conversions × energy_per_bit under a registered bit-per-conversion rule.
  # Closed-loop wavelength-lock control logic for one resonant device (tuner logic only).
  # NOT the heater (that is thermal.*), NOT a system controller, sequencer, host interface or clocking.
  control:
    tuner_logic_power:
      {low: null, typical: 0.74, high: null, unit: mW, source: sun2016,
       notes: "measured logic power of the bit-statistical microring thermal tuner (45 nm CMOS-SOI), as stated in the abstract; heater power excluded"}
    # One published tuner-logic energy-per-bit point (estimate: measured logic power / stated data rate).
    # Never interpolate; not a whole-accelerator control-electronics power.
    published_designs:
      kind: points
      type: microring_tuner_logic
      unit: fJ/bit
      source: [sun2016]
      source_type: estimate
      points:
        - {source: sun2016, basis: tuner_logic_power_over_5Gbps, data_rate_Gbps: 5.0,
           logic_power_mW: 0.74, energy_per_bit_fJ: 148.0,
           derivation: "estimate: 0.74 mW measured tuner logic power / 5 Gb/s transmitter data rate = 148 fJ/bit; cross-check: thesis Fig. 6-16 backend 152 fJ/bit at 5 Gb/s (frontend 39 fJ/bit may not be in the 0.74 mW figure)"}
      notes: >-
        Per-ring closed-loop wavelength-lock tuner logic energy per bit (Sun et al. JSSC 2016). Logic only:
        the heater (thermal.*), the tuner frontend (integrator, SAR ADC; about 39 fJ/bit in the author's thesis,
        possibly outside the 0.74 mW figure), the modulator driver, any system controller, sequencer, clock
        distribution and host interface are not included. One tuner serves one microring at one data rate; the
        per-bit figure assumes the logic power is spent at the 5 Gb/s transmitter rate stated in the abstract.
        Convert to per-token energy only as conversions × energy_per_bit under a registered bit-per-conversion rule.

  # Host-side PCIe/CXL link PHY (one-end transceiver TX+RX). NOT device DRAM (memory.*),
  # NOT a whole-system GPU+host mix, NOT PHY-TX-only.
  host_link:
    # One published Gen4 PCIe PHY transceiver energy-per-bit point (measured).
    # Never interpolate; convert to per-byte only as × 8 bits/byte under a registered rule.
    published_designs:
      kind: points
      type: pcie_gen4_phy_transceiver
      unit: pJ/bit
      source: [li2018]
      source_type: measured
      points:
        - {source: li2018, technology: PCIe_Gen4_10nm_FinFET, basis: phy_transceiver_tx_rx,
           data_rate_Gbps_max: 16.0, energy_per_bit_pJ: 7.5, energy_per_byte_pJ: 60.0,
           derivation: "abstract measured power efficiency 7.5 pJ/b for the Gen4 PCIe transceiver (3-tap Tx EQ + 8-tap Rx DFE, CDR/clocking included in the reported efficiency); energy_per_byte_pJ = 7.5 × 8 bits/byte = 60.0 (packing conversion, labelled)"}
      notes: >-
        Host-side PCIe Gen4 PHY transceiver energy per bit (Li et al. A-SSCC 2018). One end of the link:
        TX equalization plus RX DFE on the PHY (TX+RX), as stated in the abstract. Protocol layers above the
        PHY, root-complex digital beyond the PHY, the far-end device PHY, device DRAM access, and whole-node
        GPU uncore wake-up are not included. Convert to energy per byte as bits/byte × this value (8) under
        a registered host-transfer byte rule; do not treat as HBM2 (oconnor2017) or as a system PCIe mix.

  # Phase random-walk (Brownian) rates from one published processor. NOT on-chip weight drift, NOT thermal
  # drift of programmed phase shifters; input-fiber relative phase in one unstabilized lab setup.
  drift:
    # Two separate published model-fit points; never interpolate, never average.
    # Use as a recalibration time axis only through a registered phase-to-weight rule (E-039, D-040).
    published_designs:
      kind: points
      type: input_fiber_relative_phase_random_walk
      unit: rad/sqrt(s)
      source: [elmas2025]
      source_type: measured
      points:
        - {source: elmas2025, basis: brownian_fit_to_phase_distribution, sigma_rad_per_sqrt_s: 0.25,
           evidence: "Sec. 4 text and Fig. 3 caption: 35 measured runs x 300 s; simulated distribution with sigma = 0.25 [sec]^-1/2 differs from the measured one by about 9%"}
        - {source: elmas2025, basis: brownian_fit_to_feedback_trace, sigma_rad_per_sqrt_s: 0.15,
           evidence: "Sec. 6 text and Fig. 6 caption: feedback-control run (38 Hz, off for first 60 s) simulated with sigma = 0.15 [sec]^-1/2"}
      notes: >-
        Brownian phase random walk, var(phi(t)) = sigma^2 t with phi in rad and t in s (Elmas et al. Applied Optics
        2025, Eq. 2). Each sigma is the authors' model parameter matched to measured data (source type measured
        refers to the experiment; the number itself is a fitted model value). The disturbance is relative phase
        between two input fibers driven by cooling-fan airflow, outside the chip; it is not drift of programmed
        mesh phases or weights, not temperature drift, and depends on that lab's packaging and environment.
