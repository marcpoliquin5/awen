[package]
name = "awen_runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Experimental runtime and hardware abstraction layer for AWEN"
repository = "https://github.com/marcpoliquin5/awen"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
jsonschema = "0.16"

# Artifact storage and reproducibility (Phase 2.6)
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
tar = "0.4.46"
walkdir = "2.4"
num_cpus = "1.16"

ed25519-dalek = "2.2"
base64 = "0.21"

# Core dependencies
rand = "0.8"
uuid = { version = "1.4", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.104"
clap = { version = "4.2", features = ["derive"] }
once_cell = "1.20"
wait-timeout = "0.2"
awen_compiler = { path = "../awen-compiler" }

[dev-dependencies]
tempfile = "3.8"
