[package]
name = "awen_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Python bindings for the AWEN compiler and photonic GEMM simulator"
repository = "https://github.com/marcpoliquin5/awen"
publish = false

[lib]
name = "awen_native"
crate-type = ["cdylib"]

[dependencies]
awen_compiler = { path = "../awen-compiler" }
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
serde_json = "1.0"
