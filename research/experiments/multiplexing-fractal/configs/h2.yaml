# H2 full-run config (registered before any full run; see ../PREREGISTRATION.md).
id: H2
schema: awen.fractal-prereg-config.v1
hypothesis: "Kronecker-3 and tensor-train FFN layers give more useful MACs per conversion than dense at matched parameters, without losing accuracy"
status: registered
pilot: {pr: 128, commit: 0974f38, files: [h2_pilot_runs.jsonl], role: exploratory}
task: {name: char_lm_tiny_shakespeare, harness: awen_models.efficiency, split: harness default}
variants: [baseline, kron3, tensor-train]  # monarch is H1 (v2 section 10)
parameter_match_tolerance: 0.03
steps: 1500
seeds: [101, 102, 103]  # disjoint from pilot seeds 1, 2
threads: 4
latency: {batch_size: 1, concurrent_runs: 1, repeats: 50}
metrics: [val_loss_nats_per_char, conversions_per_useful_mac, forward_latency_ms_b1]
conversion_mapping:
  dense: "one DAC per modulated input element and one ADC per detected output, per matrix-vector product"
  kron3: "A on spatial modes (full mixing), B on polarization (2x2), C on wavelength (diagonal weight + detector sum)"
  tensor-train: "core 1 on spatial modes (full mixing), core 2 on wavelength (diagonal weight + detector sum)"
falsification:
  accuracy: "Killed if val_loss(candidate) - val_loss(baseline) has a 95% paired-t interval over seeds entirely > 0"
  conversions: "Killed if conversions_per_useful_mac(candidate) >= conversions_per_useful_mac(baseline)"
  latency: "Killed (v2 section 7) if it wins on parameters but forward latency is > 1.2x baseline"
command: "python research/experiments/multiplexing-fractal/h2_structured_weights.py --config research/experiments/multiplexing-fractal/configs/h2.yaml"
# Amendment A1 (2026-10-25, before any H2 full run; PREREGISTRATION.md H2 amendment A1, DECISIONS.md D-019).
# The originally registered kron3 shape (4,4,8) -> (8,16,16), rank 289, puts 4 -> 16 and 16 -> 4 factors on
# polarization, which is illegal (2x2 only). A1 replaces it with a legal shape at matched parameters. Factor
# order is (spatial, polarization, wavelength). rank_chunk only bounds memory (forward and gradient are
# equivalent, tested on main), it does not change the model.
kron3_shape: {in: [8, 2, 8], hidden: [32, 2, 32], rank: 126, rank_chunk: 18, amendment: A1}
# Amendment A2 (2026-10-26, before any H2 full run; PREREGISTRATION.md H2 amendment A2, DECISIONS.md D-020).
# Train kron3 on the opt-in dense_weight path (same model, forward and gradient equivalent, tested on main, #158)
# because the contraction path takes about 32 s per batch-32 step on the build box (about 40 h for the arm).
# The batch-1 latency kill rule uses the contraction path (the structured execution, rank_chunk as above);
# the dense_weight latency is measured on the same trained model and reported only.
kron3_execution: {train: dense_weight, latency_verdict: contraction, latency_also_report: [dense_weight], amendment: A2}
