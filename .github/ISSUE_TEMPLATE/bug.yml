name: Bug report
description: Report reproducible incorrect behavior
title: "Bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; use the private security advisory link.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the complete error and the smallest reproducible input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and revision
      description: Include commit SHA, OS, Rust/Python/LLVM versions, and backend type.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction evidence
      description: Provide commands, fixtures, and whether values are measured, simulated, estimated, or assumed.
    validations:
      required: true
