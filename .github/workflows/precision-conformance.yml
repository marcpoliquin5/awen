name: Precision conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "awen-compiler/**"
      - "awen-runtime/tests/precision_conformance.rs"
      - "awen-runtime/plugins/reference_sim/backend-manifest.json"
      - "awen-spec/schemas/awen_precision.v1.json"
      - "awen-spec/schemas/awen_error_report.v1.json"
      - "awen-spec/schemas/awen_tensor_ir.v1.json"
      - "awen-spec/schemas/awen_photonic_ir.classical.v1.json"
      - "awen-spec/schemas/awen_device_ir.v1.json"
      - "awen-spec/schemas/awen_device_capability.v1.json"
      - "awen-spec/aeps/AEP-0017-precision-and-error-contracts.md"
      - ".github/workflows/precision-conformance.yml"
  push:
    branches: [main]
    paths:
      - "awen-compiler/**"
      - "awen-runtime/tests/precision_conformance.rs"
      - "awen-runtime/plugins/reference_sim/backend-manifest.json"
      - "awen-spec/schemas/awen_precision.v1.json"
      - "awen-spec/schemas/awen_error_report.v1.json"
      - "awen-spec/schemas/awen_tensor_ir.v1.json"
      - "awen-spec/schemas/awen_photonic_ir.classical.v1.json"
      - "awen-spec/schemas/awen_device_ir.v1.json"
      - "awen-spec/schemas/awen_device_capability.v1.json"
      - "awen-spec/aeps/AEP-0017-precision-and-error-contracts.md"
      - ".github/workflows/precision-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision:
    name: Precision and error contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: |
          cargo fmt --manifest-path awen-compiler/Cargo.toml --all -- --check
          cargo fmt --manifest-path awen-runtime/Cargo.toml --all -- --check
      - name: Lint compiler precision surfaces
        run: cargo clippy --manifest-path awen-compiler/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run compiler precision conformance
        run: cargo test --manifest-path awen-compiler/Cargo.toml --all-features --no-fail-fast
      - name: Validate serialized precision artifacts
        run: cargo test --manifest-path awen-runtime/Cargo.toml --test precision_conformance
