name: AWEN Required Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: awen-required-quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: AWEN required quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check repository policy
        run: python scripts/validate_repository.py

      - name: Check compiler formatting
        run: cargo fmt --manifest-path awen-compiler/Cargo.toml --all -- --check

      - name: Lint compiler
        run: cargo clippy --manifest-path awen-compiler/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test compiler
        run: cargo test --manifest-path awen-compiler/Cargo.toml --all-features --no-fail-fast

      - name: Check runtime formatting
        run: cargo fmt --manifest-path awen-runtime/Cargo.toml --all -- --check

      - name: Lint runtime
        run: cargo clippy --manifest-path awen-runtime/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test runtime
        run: cargo test --manifest-path awen-runtime/Cargo.toml --all-features --no-fail-fast

      - name: Compile and execute C++20 ABI consumer
        working-directory: awen-runtime
        run: |
          cargo build --lib
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude \
            examples/framework_cpp.cpp -Ltarget/debug -lawen_runtime \
            -Wl,-rpath,"$PWD/target/debug" -o /tmp/awen-framework-cpp
          LD_LIBRARY_PATH="$PWD/target/debug" \
            /tmp/awen-framework-cpp | grep "19 22 43 50"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: awen-ecosystem/python_awen/pyproject.toml

      - name: Install minimum supported Python frameworks
        run: |
          python -m pip install --disable-pip-version-check \
            "pip-audit==2.10.1" \
            "torch==2.10.0" \
            "jax==0.9.0" \
            "flatbuffers>=24" \
            "numpy>=1.26,<3" \
            "pytest>=8,<10" \
            "jsonschema>=4,<5" \
            -e ./awen-ecosystem/python_awen

      - name: Validate JSON schemas and checked instances
        run: python scripts/validate_json.py

      - name: Test minimum supported Python frameworks
        run: python -m pytest awen-ecosystem/python_awen/tests -q

      - name: Install current supported Python frameworks
        run: |
          python -m pip install --disable-pip-version-check --upgrade \
            "torch==2.13.0" \
            "jax==0.11.0"

      - name: Test current supported Python frameworks
        run: python -m pytest awen-ecosystem/python_awen/tests -q

      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file awen-compiler/Cargo.lock
          cargo audit --file awen-runtime/Cargo.lock

      - name: Scan dependency licenses
        run: python scripts/check_dependency_licenses.py

      - name: Install MLIR compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-20 \
            clang-format-20 \
            cmake \
            libmlir-20-dev \
            lld-20 \
            llvm-20-dev \
            mlir-20-tools \
            ninja-build

      - name: Configure AWEN MLIR compiler
        run: |
          cmake -S awen-mlir -B awen-mlir/build -G Ninja \
            -DMLIR_DIR=/usr/lib/llvm-20/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Check AWEN MLIR C++ formatting
        run: |
          find awen-mlir \
            -path 'awen-mlir/build' -prune -o \
            \( -name '*.cpp' -o -name '*.h' \) \
            -exec clang-format-20 --dry-run --Werror {} +

      - name: Build and test AWEN MLIR compiler
        run: |
          cmake --build awen-mlir/build --target awen-opt awen-compile -j2
          ctest --test-dir awen-mlir/build --output-on-failure

      - name: Verify direct compiler-to-runtime executable ABI
        run: |
          awen-mlir/build/tools/awen-compile/awen-compile \
            awen-mlir/test/stablehlo_gemm.mlir \
            -o /tmp/stablehlo_gemm.awenx
          cargo run --manifest-path awen-runtime/Cargo.toml \
            --bin awenctl -- execute /tmp/stablehlo_gemm.awenx
