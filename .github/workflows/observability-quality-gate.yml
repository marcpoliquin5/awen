name: AWEN Required Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: awen-required-quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: AWEN required quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            awen-compiler
            awen-runtime

      - name: Check compiler formatting
        run: cargo fmt --manifest-path awen-compiler/Cargo.toml --all -- --check

      - name: Lint compiler
        run: cargo clippy --manifest-path awen-compiler/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test compiler
        run: cargo test --manifest-path awen-compiler/Cargo.toml --all-features --no-fail-fast

      - name: Check runtime formatting
        run: cargo fmt --manifest-path awen-runtime/Cargo.toml --all -- --check

      - name: Lint runtime
        run: cargo clippy --manifest-path awen-runtime/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test runtime
        run: cargo test --manifest-path awen-runtime/Cargo.toml --all-features --no-fail-fast

      - name: Install MLIR compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-20 \
            clang-format-20 \
            cmake \
            libmlir-20-dev \
            lld-20 \
            llvm-20-dev \
            mlir-20-tools \
            ninja-build

      - name: Configure AWEN MLIR compiler
        run: |
          cmake -S awen-mlir -B awen-mlir/build -G Ninja \
            -DMLIR_DIR=/usr/lib/llvm-20/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Check AWEN MLIR C++ formatting
        run: |
          find awen-mlir \
            -path 'awen-mlir/build' -prune -o \
            \( -name '*.cpp' -o -name '*.h' \) \
            -exec clang-format-20 --dry-run --Werror {} +

      - name: Build and test AWEN MLIR compiler
        run: |
          cmake --build awen-mlir/build --target awen-opt awen-compile -j2
          ctest --test-dir awen-mlir/build --output-on-failure

      - name: Verify direct compiler-to-runtime executable ABI
        run: |
          awen-mlir/build/tools/awen-compile/awen-compile \
            awen-mlir/test/stablehlo_gemm.mlir \
            -o /tmp/stablehlo_gemm.awenx
          cargo run --manifest-path awen-runtime/Cargo.toml \
            --bin awenctl -- execute /tmp/stablehlo_gemm.awenx

      - name: Validate JSON fixtures and schemas parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              *Path("awen-compiler/examples").glob("*.json"),
              *Path("awen-compiler/capabilities").glob("*.json"),
              *Path("awen-compiler/cost_models").glob("*.json"),
              *Path("awen-runtime/plugins").glob("**/*.json"),
              *Path("awen-spec/schemas").glob("*.json"),
          ]
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"parsed {len(paths)} JSON documents")
          PY

      - name: Check Python package syntax
        run: python -m compileall -q awen-ecosystem/python_awen

      - name: Test Python capability contract
        env:
          PYTHONPATH: awen-ecosystem/python_awen
        run: python -m unittest discover -s awen-ecosystem/python_awen/tests -p 'test_capabilities.py'
