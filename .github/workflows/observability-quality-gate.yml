name: AWEN Required Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday 09:17 UTC: catches new lints and newly published
    # advisories on main even when nobody pushes.
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: awen-required-quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: AWEN required quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Install minimum supported Rust version
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            awen-compiler -> target
            awen-runtime -> target
            awen-native -> target

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Check repository policy
        run: python scripts/validate_repository.py

      - name: Check compiler formatting
        run: cargo fmt --manifest-path awen-compiler/Cargo.toml --all -- --check

      - name: Lint compiler
        run: cargo clippy --manifest-path awen-compiler/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Check minimum supported Rust version
        run: |
          cargo +1.88.0 check --locked --manifest-path awen-compiler/Cargo.toml --all-targets --all-features
          cargo +1.88.0 check --locked --manifest-path awen-runtime/Cargo.toml --all-targets --all-features
          cargo +1.88.0 check --locked --manifest-path awen-native/Cargo.toml --all-targets

      - name: Test compiler
        run: cargo test --manifest-path awen-compiler/Cargo.toml --all-features --no-fail-fast

      - name: Check runtime formatting
        run: cargo fmt --manifest-path awen-runtime/Cargo.toml --all -- --check

      - name: Lint runtime
        run: cargo clippy --manifest-path awen-runtime/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test runtime
        run: cargo test --manifest-path awen-runtime/Cargo.toml --all-features --no-fail-fast

      - name: Compile and execute C++20 ABI consumer
        working-directory: awen-runtime
        run: |
          cargo build --lib
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude \
            examples/framework_cpp.cpp -Ltarget/debug -lawen_runtime \
            -Wl,-rpath,"$PWD/target/debug" -o /tmp/awen-framework-cpp
          LD_LIBRARY_PATH="$PWD/target/debug" \
            /tmp/awen-framework-cpp | grep "19 22 43 50"

      - name: Compile and execute the C SDK example (C11, awen.h)
        working-directory: awen-runtime
        run: |
          cargo build --lib
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude \
            examples/awen_c_example.c -Ltarget/debug -lawen_runtime \
            -Wl,-rpath,"$PWD/target/debug" -o /tmp/awen-c-example
          LD_LIBRARY_PATH="$PWD/target/debug" /tmp/awen-c-example | tee /tmp/awen-c-example.out
          grep -x "cgemm 5 5 -2 1" /tmp/awen-c-example.out
          grep -x "kinds-has-fft 1" /tmp/awen-c-example.out
          grep -x "reference-has-19-22-43-50 1 simulated-flag 1" /tmp/awen-c-example.out

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: awen-ecosystem/python_awen/pyproject.toml

      - name: Install minimum supported Python frameworks
        run: |
          python -m pip install --disable-pip-version-check \
            "pip-audit==2.10.1" \
            "torch==2.10.0" \
            "jax==0.9.0" \
            "flatbuffers>=24" \
            "numpy>=1.26,<3" \
            "pytest>=8,<10" \
            "jsonschema>=4,<5" \
            -e ./awen-ecosystem/python_awen

      - name: Validate JSON schemas and checked instances
        run: python scripts/validate_json.py

      - name: Test minimum supported Python frameworks
        run: python -m pytest awen-ecosystem/python_awen/tests -q

      - name: Install current supported Python frameworks
        run: |
          python -m pip install --disable-pip-version-check --upgrade \
            "torch==2.14.1" \
            "jax==0.11.0"

      - name: Test current supported Python frameworks
        run: python -m pytest awen-ecosystem/python_awen/tests -q

      - name: Check native binding formatting and lints
        run: |
          cargo fmt --manifest-path awen-native/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path awen-native/Cargo.toml --all-targets -- -D warnings

      - name: Build the awen_native Python extension
        run: python -m pip install --disable-pip-version-check ./awen-native

      - name: Test the native binding and Rust-routed photonic execution
        run: python -m pytest awen-native/tests awen-ecosystem/python_awen/tests -q

      - name: Install awen-models
        run: python -m pip install --disable-pip-version-check "./awen-models[test]"

      - name: Test awen-models (bundled AWEN-Mini checkpoint, ablation harness, HF adapter)
        env:
          OMP_NUM_THREADS: "2"
        run: python -m pytest awen-models/tests -q

      - name: Run physics validation notebooks
        run: |
          python -m pip install --disable-pip-version-check "./awen-physics[test]"
          python -m pytest awen-physics/tests -q

      - name: Test quantum-photonic reference simulators
        run: |
          python -m pip install --disable-pip-version-check "./awen-qphotonic[test]"
          python -m pytest awen-qphotonic/tests -q

      - name: Test research ledger and frontier-physics checks
        run: python -m pytest research/tests -q

      - name: Test system models (memory technologies, KV-cache study)
        run: |
          python -m pip install --disable-pip-version-check "./awen-systems[test]"
          python -m pytest awen-systems/tests -q

      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Audit Rust dependencies
        run: |
          cargo audit --file awen-compiler/Cargo.lock
          cargo audit --file awen-runtime/Cargo.lock
          cargo audit --file awen-native/Cargo.lock

      - name: Scan dependency licenses
        run: python scripts/check_dependency_licenses.py

      - name: Install cargo-deny and cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-cyclonedx@0.5.9

      - name: Enforce Rust license and source policy (cargo-deny, deny.toml)
        run: |
          for crate in awen-compiler awen-runtime awen-native; do
            cargo deny --manifest-path "$crate/Cargo.toml" --config deny.toml check licenses sources
          done

      - name: Check safe model loading policy (no remote code, no pickle)
        run: |
          python scripts/check_safe_model_loading.py
          python -m pytest scripts/tests -q

      - name: Generate CycloneDX SBOMs
        run: python scripts/generate_sbom.py --out sbom --python

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: awen-sbom-${{ github.sha }}
          path: sbom/
          retention-days: 30

      - name: Install MLIR compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-20 \
            clang-format-20 \
            cmake \
            libmlir-20-dev \
            lld-20 \
            llvm-20-dev \
            mlir-20-tools \
            ninja-build

      - name: Configure AWEN MLIR compiler
        run: |
          cmake -S awen-mlir -B awen-mlir/build -G Ninja \
            -DMLIR_DIR=/usr/lib/llvm-20/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Check AWEN MLIR C++ formatting
        run: |
          find awen-mlir \
            -path 'awen-mlir/build' -prune -o \
            \( -name '*.cpp' -o -name '*.h' \) \
            -exec clang-format-20 --dry-run --Werror {} +

      - name: Build and test AWEN MLIR compiler
        run: |
          cmake --build awen-mlir/build --target awen-opt awen-compile -j2
          ctest --test-dir awen-mlir/build --output-on-failure

      - name: Verify direct compiler-to-runtime executable ABI
        run: |
          awen-mlir/build/tools/awen-compile/awen-compile \
            awen-mlir/test/stablehlo_gemm.mlir \
            -o /tmp/stablehlo_gemm.awenx
          cargo run --manifest-path awen-runtime/Cargo.toml \
            --bin awenctl -- execute /tmp/stablehlo_gemm.awenx
          python - <<'PY'
          import json, random
          rng = random.Random(0)
          def matrix(rows, cols):
              return {"shape": [rows, cols], "data": [rng.uniform(-1, 1) for _ in range(rows * cols)]}
          inputs = {"version": "awen.execution-inputs.v1", "dispatches": [{"lhs": matrix(256, 128), "rhs": matrix(128, 64)}]}
          json.dump(inputs, open("/tmp/gemm_inputs.json", "w"))
          PY
          cargo run --manifest-path awen-runtime/Cargo.toml \
            --bin awenctl -- execute /tmp/stablehlo_gemm.awenx \
            --inputs /tmp/gemm_inputs.json --ideal --output /tmp/gemm_ideal.json
          cargo run --manifest-path awen-runtime/Cargo.toml \
            --bin awenctl -- execute /tmp/stablehlo_gemm.awenx \
            --inputs /tmp/gemm_inputs.json --seed 1 --output /tmp/gemm_noisy.json
          python - <<'PY'
          import json
          ideal = json.load(open("/tmp/gemm_ideal.json"))["dispatches"][0]
          noisy = json.load(open("/tmp/gemm_noisy.json"))["dispatches"][0]
          assert ideal["result"]["shape"] == [256, 64], ideal["result"]["shape"]
          assert ideal["max_abs_error"] < 1e-9, ideal["max_abs_error"]
          assert noisy["rms_error"] > 0, noisy["rms_error"]
          print("ideal max error", ideal["max_abs_error"], "noisy relative rms", noisy["relative_rms_error"])
          PY
          awen-mlir/build/tools/awen-compile/awen-compile \
            awen-mlir/test/batched_gemm.mlir \
            -o /tmp/batched_gemm.awenx
          cargo run --manifest-path awen-runtime/Cargo.toml \
            --bin awenctl -- execute /tmp/batched_gemm.awenx
