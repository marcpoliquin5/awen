name: Framework integration

on:
  pull_request:
    branches: [main]
    paths:
      - "awen-ecosystem/python_awen/**"
      - "awen-runtime/**"
      - "awen-spec/schemas/awen_framework_*.json"
      - "awen-spec/aeps/AEP-0016-framework-integration.md"
      - ".github/workflows/framework-integration.yml"
  push:
    branches: [main]
    paths:
      - "awen-ecosystem/python_awen/**"
      - "awen-runtime/**"
      - "awen-spec/schemas/awen_framework_*.json"
      - "awen-spec/aeps/AEP-0016-framework-integration.md"
      - ".github/workflows/framework-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-frameworks:
    name: Python ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum supported
            torch: "2.10.0"
            jax: "0.9.0"
          - name: current supported
            torch: "2.13.0"
            jax: "0.11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: awen-ecosystem/python_awen/pyproject.toml
      - name: Install exact framework versions
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            "torch==${{ matrix.torch }}" `
            "jax==${{ matrix.jax }}" `
            "flatbuffers>=24" `
            "numpy>=1.26,<3" `
            "pytest>=8,<10" `
            "jsonschema>=4,<5" `
            -e awen-ecosystem/python_awen
      - name: Run framework conformance tests
        run: python -m pytest awen-ecosystem/python_awen/tests -q

  compiled-abi:
    name: Compiled C and C++ ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify and build Rust library
        working-directory: awen-runtime
        run: |
          cargo fmt --all -- --check
          cargo clippy --lib --all-features -- -D warnings
          cargo test --lib ffi::tests::c_abi_gemm_and_error_contract
          cargo build --lib
      - name: Compile and execute C++20 consumer
        working-directory: awen-runtime
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude \
            examples/framework_cpp.cpp -Ltarget/debug -lawen_runtime \
            -Wl,-rpath,"$PWD/target/debug" -o /tmp/awen-framework-cpp
          LD_LIBRARY_PATH="$PWD/target/debug" /tmp/awen-framework-cpp | grep "19 22 43 50"
